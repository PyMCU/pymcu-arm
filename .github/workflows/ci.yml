name: CI

on:
  push:
    branches: ["main", "development", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build C# (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout pymcu-arm
        uses: actions/checkout@v4
        with:
          path: pymcu-arm

      - name: Checkout pymcu monorepo
        uses: actions/checkout@v4
        with:
          repository: PyMCU/PyMCU
          ref: main
          path: PyMCU
          submodules: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: PyMCU/global.json

      - name: Build pymcuc compiler
        shell: bash
        working-directory: PyMCU
        run: dotnet publish src/compiler/PyMCU.csproj -c Release -o ../pymcu-arm/build/bin --nologo

      - name: Build pymcuc-arm backend CLI
        shell: bash
        working-directory: pymcu-arm
        run: dotnet publish src/csharp/cli/PyMCU.Backend.ARM.Cli.csproj -c Release -o build/bin --nologo

  # ---------------------------------------------------------------------------
  # Full integration tests (RP2040 LLVM pipeline). Linux only — uses native
  # LLVM tools downloaded by pymcu-arm-toolchain for the linux-x64 platform.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration Tests (RP2040)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout pymcu-arm
        uses: actions/checkout@v4
        with:
          path: pymcu-arm

      # The RP2350 half of the suite needs RP2350Sharp, a PRIVATE repository that
      # GITHUB_TOKEN cannot clone. Without it every run stopped at PYMCUSIB001 before
      # any test ran, the RP2040 tests included, although they need nothing from it.
      #
      # With an RP2350SHARP_TOKEN secret (read-only on RP2350Sharp) the whole suite
      # runs. Without one the RP2040 half still runs and the RP2350 half is excluded
      # at build time (IncludeRp2350Tests=false), and this step says so in a warning
      # annotation and in the run summary: a partial run is never shown as a full one.
      # A token that is set but cannot clone fails the checkout below, red.
      - name: Check RP2350Sharp access
        id: rp2350sharp
        env:
          RP2350SHARP_TOKEN: ${{ secrets.RP2350SHARP_TOKEN }}
        run: |
          if [ -n "$RP2350SHARP_TOKEN" ]; then
            echo "include=true" >> "$GITHUB_OUTPUT"
            echo "RP2350SHARP_TOKEN is set: the RP2040 and RP2350 tests will run."
          else
            echo "include=false" >> "$GITHUB_OUTPUT"
            msg="RP2350 integration tests NOT RUN: they need the private RP2350Sharp repository and no RP2350SHARP_TOKEN secret is configured. Only the RP2040 tests ran. Run the RP2350 half locally with RP2350Sharp cloned beside pymcu-arm."
            echo "::warning title=RP2350 integration tests skipped::$msg"
            {
              echo "### RP2350 integration tests skipped"
              echo
              echo "$msg"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Private sibling: tests/integration references ../../../RP2350Sharp/src/...
      - name: Checkout RP2350Sharp
        if: steps.rp2350sharp.outputs.include == 'true'
        uses: actions/checkout@v4
        with:
          repository: PyMCU/RP2350Sharp
          path: RP2350Sharp
          token: ${{ secrets.RP2350SHARP_TOKEN }}

      # Checkout monorepo to build pymcuc (compiler binary).
      # TODO: replace with `pip install pymcu-compiler` once published to PyPI.
      - name: Checkout pymcu monorepo
        uses: actions/checkout@v4
        with:
          repository: PyMCU/PyMCU
          ref: main
          path: PyMCU
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: PyMCU/global.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pymcuc compiler
        working-directory: PyMCU
        run: |
          dotnet publish src/compiler/PyMCU.csproj \
            -c Release -o ../pymcu-arm/build/bin --nologo

      - name: Build pymcuc-arm backend CLI
        working-directory: pymcu-arm
        run: |
          dotnet publish src/csharp/cli/PyMCU.Backend.ARM.Cli.csproj \
            -c Release -o build/bin --nologo

      - name: Install Python dependencies
        working-directory: pymcu-arm
        run: |
          uv venv .venv
          uv pip install --python .venv pymcu-sdk
          uv pip install --python .venv -e ../PyMCU/lib  # development stdlib
          uv pip install --python .venv pymcu-arm-toolchain
          uv pip install --python .venv -e ../PyMCU
          uv pip install --python .venv -e . --no-deps
          uv pip install --python .venv -e ../PyMCU/external/pymcu-micropython
          uv pip install --python .venv -e ../PyMCU/external/pymcu-circuitpython

      - name: Configure environment
        working-directory: pymcu-arm
        run: |
          echo "$GITHUB_WORKSPACE/pymcu-arm/.venv/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/pymcu-arm/build/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/pymcu-arm/.venv" >> $GITHUB_ENV

      - name: Pre-seed ARM toolchain cache
        # get_tool() downloads 300+ MB from GitHub Releases on first call.
        # Run it here (outside the 120s test timeout) so the tools are cached
        # before the integration tests trigger them via Rp2040LlvmToolchain.
        working-directory: pymcu-arm
        run: |
          "$GITHUB_WORKSPACE/pymcu-arm/.venv/bin/python3" -c "
          import pymcu_arm_toolchain as tc
          for name in tc.TOOLS:
              print(name, '->', tc.get_tool(name))
          "

      - name: Restore integration test packages
        working-directory: pymcu-arm
        run: |
          dotnet restore tests/integration/PyMCU.IntegrationTests.csproj --nologo \
            -p:IncludeRp2350Tests=${{ steps.rp2350sharp.outputs.include }}

      - name: Run integration tests
        working-directory: pymcu-arm
        run: |
          dotnet test tests/integration/PyMCU.IntegrationTests.csproj \
            --no-restore \
            -p:IncludeRp2350Tests=${{ steps.rp2350sharp.outputs.include }} \
            --logger "trx;LogFileName=integration-results.trx" \
            --logger "console;verbosity=normal" \
            --blame-hang-timeout 120s \
            --results-directory test-results \
            --nologo \
            -- NUnit.NumberOfTestWorkers=1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: pymcu-arm/test-results/
          retention-days: 15
