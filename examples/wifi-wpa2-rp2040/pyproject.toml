[project]
name = "rp2040-wifi-wpa2"
version = "0.1.0"
requires-python = ">=3.11"

# The WPA2 sibling of wifi-cyw43-rp2040. Same board, same driver, and the only difference in
# src/main.py is join_wpa2() in place of join_open(): the four-way handshake runs in the
# CYW43439's own firmware, so the host sends ten ioctls instead of one and nothing else moves.
[tool.pymcu]
target    = "rp2040"
frequency = 125000000
sources   = "src"
entry     = "main.py"
stdlib    = ["micropython"]
